project:
  type: website
  preview:
    watch-inputs: true

website:
  site-url: 'https://equator-network.github.io/equator-website/'
  image: "assets/logos/equator_logo.png"
  favicon: "assets/favicons/equator-network-16x16.png"
  search: false 
  bread-crumbs: false
  navbar:
    background: light
    logo: "assets/logos/equator_logo.png"
    logo-alt: EQUATOR Network Home Page
    right:
      - text: About
        menu: 
          - text: The UK EQUATOR Centre
            href: about/uk-equator-centre.qmd
          - text: The EQUATOR Network
            href: about/equator-network.qmd
          - text: International EQUATOR Centres
            href: about/international-equator-centres.qmd
          - text: Contact
            href: about/contact.qmd
      - text: Reporting Guidelines
        menu: 
          - text: What are reporting guidelines?
            href: about/reporting-guidelines.qmd
          - text: Search reporting guidelines
            href: reporting-guidelines/index.qmd
          - text: Search reporting guidelines under development
            href: reporting-guidelines/under-development/index.qmd
      - text: Toolkits
        menu: 
          - text: For authors
            href: toolkits/writing-research/index.qmd
          - text: For journals
            href: toolkits/using-guidelines-in-journals/index.qmd
          - text: For peer reviewers
            href: toolkits/peer-reviewing-research.qmd
          - text: For reporting guideline developers
            href: toolkits/developing-a-reporting-guideline/index.qmd
      - href: https://www.ndorms.ox.ac.uk/study/courses/equator-publication-school
        text: Training
      - href: reporting-guidelines/index.qmd
        icon: search
  page-footer:
    left: |
      Created by the
      [UK EQUATOR Centre](/about/uk-equator-centre.qmd)
    center:
      - text: "Terms of Use"
        href: terms-of-use.qmd
      - text: "Privacy Policy"
        href: privacy-policy.qmd
        # #TODO license?
    right:
      - icon: twitter
        href: https://twitter.com/equatornetwork
        aria-label: Quarto Twitter
      - icon: github
        aria-label: EQUATOR GitHub
        href: https://github.com/EQUATOR-Network/equator-website
  page-navigation: true
  open-graph: true
  sidebar:
    - id: developers
      title: "For reporting guideline developers"
      style: "docked"
      collapse-level: 2
      contents:
        - text: Introduction
          href: toolkits/developing-a-reporting-guideline/index.qmd
        - text: Identifying the need
          href: toolkits/developing-a-reporting-guideline/identifying-the-need-for-a-new-reporting-guideline.qmd
        - text: Getting ready
          href: toolkits/developing-a-reporting-guideline/getting-ready-to-develop-your-guideline.qmd
        - text: Developing
          href: toolkits/developing-a-reporting-guideline/developing-your-reporting-guideline.qmd
        - text: Writing up and publishing
          href: toolkits/developing-a-reporting-guideline/writing-up-and-publishing-your-reporting-guideline.qmd
        - text: Disseminating
          href: toolkits/developing-a-reporting-guideline/disseminating-your-reporting-guideline.qmd
        - text: Updating
          href: toolkits/developing-a-reporting-guideline/updating-and-extending-your-reporting-guideline.qmd
        - text: More resources
          href: toolkits/developing-a-reporting-guideline/more-resources-on-developing-a-reporting-guideline.qmd
    - id: journals
      title: "For journals"
      style: "docked"
      collapse-level: 2
      contents:
        - text: Introduction
          href: toolkits/using-guidelines-in-journals/index.qmd
        - text: What's wrong with reporting
          href: toolkits/using-guidelines-in-journals/whats-wrong-with-health-reporting-today.qmd
        - text: How it affects you
          href: toolkits/using-guidelines-in-journals/how-poor-reporting-affects-you.qmd
        - text: Common myths
          href: toolkits/using-guidelines-in-journals/reporting-guidelines-and-journals-fact-fiction.qmd
        - text: Formulating a plan
          href: toolkits/using-guidelines-in-journals/creating-your-journals-reporting-guideline-policy.qmd
        - text: Implementation routes
          href: toolkits/using-guidelines-in-journals/four-possible-implementation-routes.qmd

format:
  html:
    theme: cosmo
    css: /assets/css/main.css
    toc: true
    title-block-banner: true
    title-block-banner-color: white
    grid:
      sidebar-width: 250px
      body-width: 800px
      margin-width: 300px
    link-external-icon: true
    link-external-newwindow: true
    include-in-header:
      - _scripts/headers.html
      - _scripts/gtm-head.html
    include-before-body: 
      - _scripts/gtm-body.html




