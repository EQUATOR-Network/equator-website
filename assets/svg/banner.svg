<svg viewBox="0 0 1440 190" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
    <defs>
        <linearGradient id="mainGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:rgb(0, 100, 47);stop-opacity:1" />
            <stop offset="50%" style="stop-color:rgb(0, 133, 63);stop-opacity:1" />
            <stop offset="100%" style="stop-color:rgb(0, 150, 71);stop-opacity:1" />
        </linearGradient>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="0.5" opacity="0.1"/>
        </pattern>
    </defs>
    <!-- Background -->
    <rect width="1440" height="190" fill="url(#mainGreenGrad)" />
    <rect width="1440" height="190" fill="url(#grid)" />
    
    <!-- Isometric Shapes / Sheets -->
    <g transform="skewX(20) translate(-100,0)">
        <rect x="1120" y="40" width="120" height="150" fill="#FF8C00" opacity="0.8" />
        <rect x="1125" y="45" width="110" height="2" fill="white" opacity="0.3" />
        <rect x="1125" y="55" width="80" height="2" fill="white" opacity="0.3" />
        
        <rect x="940" y="-20" width="140" height="200" fill="#000033" opacity="0.6" />
        <rect x="950" y="10" width="120" height="2" fill="white" opacity="0.2" />
        
        <rect x="740" y="80" width="180" height="110" fill="white" opacity="0.1" stroke="white" stroke-width="1"/>
        <rect x="540" y="20" width="100" height="170" fill="#FF8C00" opacity="0.4" />
        <rect x="240" y="-50" width="200" height="250" fill="white" opacity="0.05" stroke="white" stroke-width="0.5"/>
    </g>

    <circle cx="240" cy="80" r="40" fill="none" stroke="rgb(0, 100, 47)" stroke-width="2" opacity="0.2" />
    <circle cx="240" cy="80" r="15" fill="rgb(0, 100, 47)" opacity="0.3" />
    <circle cx="140" cy="140" r="60" fill="none" stroke="white" stroke-width="1" opacity="0.1" />
</svg>